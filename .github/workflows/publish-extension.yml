name: publish-extension

# Publishes the VS Code extension to the Marketplace.
#
# Separate from `release` on purpose: a release should not fail because a
# Marketplace token expired, and re-publishing is sometimes needed without
# cutting a new version of the skill.
#
# Before the first run:
#   1. Create a publisher at https://marketplace.visualstudio.com/manage —
#      the id must equal `publisher` in vscode-extension/package.json.
#   2. Make an Azure DevOps personal access token, scope Marketplace > Manage,
#      organisation "All accessible organisations".
#   3. Add it as the repository secret VSCE_PAT.
#
# Until that secret exists the job stops at the first step instead of failing
# a tagged release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish the extension from"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Marketplace token is configured
        id: gate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "No VSCE_PAT secret set — skipping the Marketplace publish." >> "$GITHUB_STEP_SUMMARY"
            echo "See .github/workflows/publish-extension.yml for the one-time setup." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "20"

      # The Marketplace refuses a version it already has, so publishing the same
      # version twice is an error rather than a no-op. The tag is the version.
      - name: Check the tag matches the extension
        if: steps.gate.outputs.ready == 'true'
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          ext_version=$(node -p "require('./vscode-extension/package.json').version")
          if [ "$ext_version" != "${tag#v}" ]; then
            echo "tag $tag does not match vscode-extension version $ext_version" >&2
            exit 1
          fi

      - name: Publish
        if: steps.gate.outputs.ready == 'true'
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          npm ci
          npx --yes @vscode/vsce publish --no-git-tag-version
