name: check-skill

# The committed .skill bundle is what people download and install. If someone
# edits embedded-iot-mentor/ without rebuilding it, the bundle and the source
# folder ship different versions of the skill. This job fails when that happens.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate the skill and the committed bundle
        run: python package_skill.py --check

      # The ChatGPT port has limits the skill does not: 8000 characters of
      # instructions and 20 knowledge files. Growing the skill can push the port
      # past them, and ChatGPT only complains at paste time.
      - name: Validate the ChatGPT bundle
        run: python chatgpt-app/build_chatgpt_bundle.py --check

      # The connector is the port with moving parts. Renaming a reference file
      # or rewording a heading can quietly send every query to the same
      # document, and nobody would notice until someone asked it something.
      - name: Install the connector's dependencies
        run: pip install -r chatgpt-app/mcp-server/requirements.txt

      - name: Test the connector
        run: python chatgpt-app/mcp-server/test_server.py

      # The REST port shells out to the same scripts, so a renamed flag breaks
      # it in a way that reads to the caller like their own bad request.
      - name: Install the API's dependencies
        run: pip install -r api/requirements.txt

      - name: Test the API
        run: python api/test_api.py
