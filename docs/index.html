  .chat {

    background: var(--card-bg);
    padding: 0.9rem;
    margin-top: 0.75rem;

  .msg.error {

const leadEl = document.getElementById("lead");
const askH2El = document.getElementById("askH2");
const chatLogEl = document.getElementById("chatLog");
const chatFormEl = document.getElementById("chatForm");
const chatInputEl = document.getElementById("chatInput");
const chatSendEl = document.getElementById("chatSend");
const chatNoteEl = document.getElementById("chatNote");
const tryH2El = document.getElementById("tryH2");
const tryBodyEl = document.getElementById("tryBody");
const whatH2El = document.getElementById("whatH2");
const whatListEl = document.getElementById("whatList");
const footerEl = document.getElementById("footer");

const LANG_KEY = "eim_lang";
let currentLang = "en";
let chatHistory = []; // {role, content}, oldest first — resent each turn, the API keeps no session state
let chatBusy = false;

function buildTryTable(lang) {
  tryBodyEl.textContent = "";
  for (const [where, html] of I18N[lang].tryRows) {
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = where;
    const td = document.createElement("td");
    td.innerHTML = html;
    tr.appendChild(th);
    tr.appendChild(td);
    tryBodyEl.appendChild(tr);
  }
}

function buildWhatList(lang) {
  whatListEl.textContent = "";
  for (const item of I18N[lang].what) {
    const li = document.createElement("li");
    li.textContent = item;
    whatListEl.appendChild(li);
  }
}

function buildFooter(lang) {
  const t = I18N[lang];
  footerEl.textContent = "";
  footerEl.appendChild(document.createTextNode(t.footerPre));
  const link = document.createElement("a");
  link.href = REPO;
  link.target = "_blank";
  link.rel = "noopener";
  link.textContent = t.footerRepoLink;
  footerEl.appendChild(link);
  footerEl.appendChild(document.createTextNode(t.footerPost));
}

function appendMsg(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  div.textContent = text;
  chatLogEl.appendChild(div);
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
  return div;
}

async function sendChatMessage(message) {
  const t = I18N[currentLang];
  chatBusy = true;
  chatInputEl.disabled = true;
  chatSendEl.disabled = true;

  appendMsg("user", message);
  const pending = appendMsg("assistant pending", t.chatThinking);

  try {
    const res = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: message, history: chatHistory }),
    });
    if (res.status === 429) {
      pending.className = "msg error";
      pending.textContent = t.chatRateLimited;
    } else if (!res.ok) {
      pending.className = "msg error";
      pending.textContent = t.chatError;
    } else {
      const data = await res.json();
      pending.className = "msg assistant";
      pending.textContent = data.reply;
      chatHistory.push({ role: "user", content: message });
      chatHistory.push({ role: "assistant", content: data.reply });
      // Matches the API's own history cap (20 messages).
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    }
  } catch (err) {
    pending.className = "msg error";
    pending.textContent = t.chatError;
  } finally {
    chatBusy = false;
    chatInputEl.disabled = false;
    chatSendEl.disabled = false;
    chatInputEl.focus();
  }
}

chatFormEl.addEventListener("submit", (e) => {
  e.preventDefault();
  const message = chatInputEl.value.trim();
  if (!message || chatBusy) return;
  chatInputEl.value = "";
  sendChatMessage(message);
});

  chatSendEl.textContent = t.chatSend;

  buildWhatList(lang);
  buildFooter(lang);

  langButtons.forEach((btn) => {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
  });
}

langButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    localStorage.setItem(LANG_KEY, btn.dataset.lang);
    applyLanguage(btn.dataset.lang);
  });
});

function detectBrowserLang() {
  const candidates = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
  for (const raw of candidates) {
    if (!raw) continue;
    const code = raw.slice(0, 2).toLowerCase();
    if (I18N[code]) return code;
  }
  return "en";
}

if (!API_BASE) {
  chatInputEl.disabled = true;
  chatSendEl.disabled = true;
}

const savedLang = localStorage.getItem(LANG_KEY);
applyLanguage(savedLang && I18N[savedLang] ? savedLang : detectBrowserLang());
</script>
</body>
</html>
