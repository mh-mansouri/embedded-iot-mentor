# Blueprint for the REST API, so "Deploy to Render" in the README needs no
# configuration. Render has to find this file at the repository root.
services:
  - type: web
    name: embedded-iot-mentor-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Left open on purpose: the docs are public and the calculators are the
      # skill's own. The per-IP rate limit is the guard. To close it, set
      # EIM_API_KEY in the Render dashboard — no redeploy needed, and
      # /healthz keeps answering so the health check still passes.
      - key: EIM_RATE_LIMIT_PER_MIN
        value: "60"
      # The origin docs/index.html's chat widget calls from. iotmentor.dev
      # moved to an unrelated product (2026-08-15); this repo's page now
      # lives only at its default GitHub Pages URL.
      - key: EIM_CORS_ORIGINS
        value: https://mh-mansouri.github.io
      # sync: false means Render prompts for this at deploy time and never
      # stores the value in this repo. Paste your OpenRouter API key there
      # (openrouter.ai/keys) — never into a committed file. /chat calls Claude
      # through OpenRouter, so this is an OpenRouter key, not an Anthropic
      # one; the two are not interchangeable. /chat stays off (501) until set.
      - key: OPENROUTER_API_KEY
        sync: false
